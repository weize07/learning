<text x="560" y="35" text-anchor="middle" font-size="23" font-weight="bold">9. 交付：引擎收束不等于业务成功</text>
<text x="560" y="59" text-anchor="middle" font-size="14">先看职责边界，再按英文标签对照源码；折返箭头为对象内部动作</text>
