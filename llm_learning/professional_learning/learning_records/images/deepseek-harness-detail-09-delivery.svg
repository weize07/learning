<text class="message" x="913" y="1056" text-anchor="start">stdout.write(text);</text>
<text class="message" x="913" y="1074" text-anchor="start">io.exit(completed ? 0 :</text>
<text class="message" x="913" y="1092" text-anchor="start">1)</text>
