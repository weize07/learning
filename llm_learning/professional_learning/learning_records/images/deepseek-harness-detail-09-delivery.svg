<rect x="535" y="76" width="210" height="64" rx="8" fill="#ede9fe" stroke="#64748b"/><text x="640" y="103" font-size="17" text-anchor="middle">Session</text><text x="640" y="128" font-size="14" text-anchor="middle">事件与同步</text>
