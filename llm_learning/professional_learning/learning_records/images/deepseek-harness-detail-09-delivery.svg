<text x="560" y="1187" text-anchor="middle" font-size="14">无额外输入、无子 Agent 的 headless 普通模式；json 输出另有投影。</text>
<text x="560" y="1212" text-anchor="middle" font-size="14">虚线为等待完成或数据返回，不是 loop 直接回调入口；flush 保证取决于后端。</text>
