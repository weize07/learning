<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">MHA, GQA and MQA head sharing</title>
  <desc id="desc">Four query heads use four key-value heads in MHA, two in GQA, and one in MQA. Lines show which KV head each query head reads.</desc>
  <rect width="960" height="340" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="160" y="35" font-size="24">MHA</text>
    <text x="480" y="35" font-size="24">GQA</text>
    <text x="800" y="35" font-size="24">MQA</text>
    <text x="160" y="62" font-size="14">4 Q heads / 4 KV heads</text>
    <text x="480" y="62" font-size="14">4 Q heads / 2 KV heads</text>
    <text x="800" y="62" font-size="14">4 Q heads / 1 KV head</text>
  </g>
  <g stroke="#64748b" stroke-width="3">
    <path d="M55 138V222 M125 138V222 M195 138V222 M265 138V222"/>
    <path d="M375 138L410 222 M445 138L410 222 M515 138L550 222 M585 138L550 222"/>
    <path d="M695 138L800 222 M765 138L800 222 M835 138L800 222 M905 138L800 222"/>
  </g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <rect x="25" y="90" width="60" height="48" rx="8"/><rect x="95" y="90" width="60" height="48" rx="8"/>
    <rect x="165" y="90" width="60" height="48" rx="8"/><rect x="235" y="90" width="60" height="48" rx="8"/>
    <rect x="345" y="90" width="60" height="48" rx="8"/><rect x="415" y="90" width="60" height="48" rx="8"/>
    <rect x="485" y="90" width="60" height="48" rx="8"/><rect x="555" y="90" width="60" height="48" rx="8"/>
    <rect x="665" y="90" width="60" height="48" rx="8"/><rect x="735" y="90" width="60" height="48" rx="8"/>
    <rect x="805" y="90" width="60" height="48" rx="8"/><rect x="875" y="90" width="60" height="48" rx="8"/>
  </g>
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="2">
    <rect x="25" y="222" width="60" height="48" rx="8"/><rect x="95" y="222" width="60" height="48" rx="8"/>
    <rect x="165" y="222" width="60" height="48" rx="8"/><rect x="235" y="222" width="60" height="48" rx="8"/>
    <rect x="380" y="222" width="60" height="48" rx="8"/><rect x="520" y="222" width="60" height="48" rx="8"/>
    <rect x="770" y="222" width="60" height="48" rx="8"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="16" fill="#0f172a">
    <text x="55" y="120">Q1</text><text x="125" y="120">Q2</text><text x="195" y="120">Q3</text><text x="265" y="120">Q4</text>
    <text x="375" y="120">Q1</text><text x="445" y="120">Q2</text><text x="515" y="120">Q3</text><text x="585" y="120">Q4</text>
    <text x="695" y="120">Q1</text><text x="765" y="120">Q2</text><text x="835" y="120">Q3</text><text x="905" y="120">Q4</text>
    <text x="55" y="252">KV1</text><text x="125" y="252">KV2</text><text x="195" y="252">KV3</text><text x="265" y="252">KV4</text>
    <text x="410" y="252">KV1</text><text x="550" y="252">KV2</text><text x="800" y="252">KV1</text>
    <text x="480" y="315" font-size="14">Lines indicate KV access, not shared query weights or averaged head outputs.</text>
  </g>
</svg>
