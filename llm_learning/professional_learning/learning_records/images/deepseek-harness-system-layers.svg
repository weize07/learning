<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness 系统全貌：装配、执行、记录与视图</title>
  <desc id="desc">三个独立分区。启动配置装配 Cordis 插件树；用户经入口向 Agent 提交输入，Driver 调用模型与工具，并经入口返回反馈；Driver、工具调度和插件追加 Session 事件，事件用于模型消息投影、界面与历史、可选持久化。蓝色实线表示提交或调用，紫色虚线表示返回或反馈，绿色实线表示记录或派生。分区之间用说明关联，避免交叉长线。</desc>
  <defs>
    <marker id="call-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="return-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7e22ce"/>
    </marker>
    <marker id="data-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#047857"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .heading { font-size: 22px; font-weight: 700; }
      .name { font-size: 20px; font-weight: 600; text-anchor: middle; }
      .detail { font-size: 17px; text-anchor: middle; fill: #334155; }
      .note { font-size: 17px; fill: #475569; }
      .label { font-size: 16px; text-anchor: middle; }
      .call-label { fill: #1d4ed8; }
      .return-label { fill: #7e22ce; }
      .data-label { fill: #047857; }
      .call { fill: none; stroke: #1d4ed8; stroke-width: 2.5; marker-end: url(#call-arrow); }
      .return { fill: none; stroke: #7e22ce; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#return-arrow); }
      .data { fill: none; stroke: #047857; stroke-width: 2.5; marker-end: url(#data-arrow); }
    </style>
  </defs>
  <rect width="1000" height="1270" fill="#ffffff"/>
  <text x="40" y="40" class="heading">DeepSeek Harness：先分清三类关系</text>
  <path d="M42 72 H100" class="call"/>
  <text x="112" y="78" class="note">提交 / 调用</text>
  <path d="M310 72 H368" class="return"/>
  <text x="380" y="78" class="note">返回 / 反馈</text>
  <path d="M578 72 H636" class="data"/>
  <text x="648" y="78" class="note">记录 / 派生</text>

  <rect x="20" y="105" width="960" height="160" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="138" class="heading">A. 启动装配：决定挂载哪些服务与能力</text>
  <rect x="60" y="161" width="370" height="60" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <text x="245" y="198" class="name">profile + bundles + patches</text>
  <path d="M430 192 H600" class="call"/>
  <text x="515" y="180" class="label call-label">compose</text>
  <rect x="600" y="161" width="340" height="60" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="770" y="198" class="name">Cordis plugin tree</text>
  <text x="60" y="246" class="note">下面的入口、Agent、模型、工具与 Session 都由插件装配；不再逐条画挂载线。</text>

  <rect x="20" y="285" width="960" height="560" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="319" class="heading">B. 运行执行：Driver 推进任务，结果沿返回线交付</text>
  <rect x="55" y="360" width="130" height="90" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="120" y="410" class="name">用户</text>
  <rect x="290" y="360" width="190" height="90" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="385" y="393" class="name">入口 / Host</text>
  <text x="385" y="424" class="detail">接收输入、展示结果</text>
  <rect x="655" y="348" width="285" height="114" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="797" y="380" class="name">ReactLoopAgent 实例</text>
  <text x="797" y="413" class="detail">Agent API / Inbox / phase</text>
  <text x="797" y="442" class="detail">实例内启动 Driver 执行活动</text>
  <path d="M185 382 H290" class="call"/>
  <text x="237" y="369" class="label call-label">submit</text>
  <path d="M290 432 H185" class="return"/>
  <text x="237" y="419" class="label return-label">render</text>
  <path d="M480 382 H655" class="call"/>
  <text x="567" y="369" class="label call-label">prompt / control</text>
  <path d="M655 432 H480" class="return"/>
  <text x="567" y="419" class="label return-label">stream / status</text>

  <path d="M700 462 V515 H355 V603" class="call"/>
  <text x="520" y="503" class="label call-label">stream(request)</text>
  <path d="M400 603 V549 H740 V462" class="return"/>
  <text x="535" y="538" class="label return-label">chunks / finish</text>
  <rect x="265" y="603" width="275" height="99" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="402" y="634" class="name">LLM 服务 / 模型适配器</text>
  <text x="402" y="664" class="detail">调用模型 API</text>
  <text x="402" y="689" class="detail">返回文本或 tool-call</text>

  <path d="M805 462 V603" class="call"/>
  <text x="771" y="585" class="label call-label">execute</text>
  <path d="M900 603 V462" class="return"/>
  <text x="930" y="530" class="label return-label">result</text>
  <rect x="655" y="603" width="285" height="72" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="797" y="633" class="name">工具管线</text>
  <text x="797" y="660" class="detail">参数校验、权限与执行策略</text>
  <path d="M745 675 V743" class="call"/>
  <text x="712" y="717" class="label call-label">call</text>
  <path d="M860 743 V675" class="return"/>
  <text x="897" y="717" class="label return-label">result</text>
  <rect x="655" y="743" width="285" height="64" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="797" y="771" class="name">执行 Provider</text>
  <text x="797" y="796" class="detail">文件、进程等实际操作</text>
  <text x="60" y="752" class="note">模型只提出工具调用；Driver 安排执行。</text>
  <text x="60" y="781" class="note">工具结果返回后，Driver 决定下一步。</text>
  <text x="60" y="817" class="note">实线与虚线是不同方向，不把调用与返回挤在同一根线上。</text>

  <rect x="20" y="865" width="960" height="340" rx="14" fill="#f0fdf4" stroke="#a7f3d0"/>
  <text x="40" y="900" class="heading">C. 记录与视图：同一份事件，面向不同消费者</text>
  <rect x="60" y="930" width="305" height="70" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="212" y="959" class="name">Driver / 工具调度 / 插件</text>
  <text x="212" y="986" class="detail">产生执行事实</text>
  <path d="M365 965 H590" class="data"/>
  <text x="477" y="952" class="label data-label">append(event)</text>
  <rect x="590" y="930" width="350" height="70" rx="10" fill="#d1fae5" stroke="#059669"/>
  <text x="765" y="959" class="name">Session events</text>
  <text x="765" y="986" class="detail">会话事件记录，不等于模型 messages</text>

  <path d="M765 1000 V1036 H185 V1096" class="data"/>
  <path d="M500 1036 V1096" class="data"/>
  <path d="M815 1036 V1096" class="data"/>
  <path d="M765 1036 H815" fill="none" stroke="#047857" stroke-width="2.5"/>
  <circle cx="500" cy="1036" r="4" fill="#047857"/>
  <circle cx="765" cy="1036" r="4" fill="#047857"/>
  <rect x="95" y="1059" width="180" height="28" fill="#f0fdf4"/>
  <rect x="420" y="1059" width="160" height="28" fill="#f0fdf4"/>
  <rect x="740" y="1059" width="150" height="28" fill="#f0fdf4"/>
  <text x="185" y="1080" class="label data-label">deriveMessages()</text>
  <text x="500" y="1080" class="label data-label">project / render</text>
  <text x="815" y="1080" class="label data-label">persist / open</text>
  <rect x="60" y="1096" width="250" height="79" rx="10" fill="#ffffff" stroke="#059669"/>
  <text x="185" y="1127" class="name">Model messages</text>
  <text x="185" y="1156" class="detail">供 Driver 后续请求使用</text>
  <rect x="375" y="1096" width="250" height="79" rx="10" fill="#ffffff" stroke="#059669"/>
  <text x="500" y="1127" class="name">UI / 历史记录</text>
  <text x="500" y="1156" class="detail">展示已提交事实</text>
  <rect x="690" y="1096" width="250" height="79" rx="10" fill="#ffffff" stroke="#059669"/>
  <text x="815" y="1127" class="name">持久化后端（可选）</text>
  <text x="815" y="1156" class="detail">保存与重新打开会话</text>

  <text x="40" y="1233" class="note">这是职责图，不是逐函数时序图；实时反馈与已提交事件分开表示。</text>
  <text x="40" y="1258" class="note">headless 不启动 Host 服务器；Session 追加记录不代表已同步写盘。</text>
</svg>
